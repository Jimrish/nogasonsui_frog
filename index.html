<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>nogasonsui_frog — Endless Runner</title>
<style>
  :root { --ink:#17324d; --blue:#1677ff; --gold:#ffd447; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); }
  body { background:linear-gradient(#8fe3ff,#e8fbff); display:flex; justify-content:center; padding:14px; }
  .app { width:min(100%,900px); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 10px; }
  h1 { font-size:clamp(1.25rem,4vw,2rem); margin:0; color:#1261c9; text-shadow:0 2px #fff; }
  .subtitle { font-size:.9rem; opacity:.8; }
  .pill { background:#fff; border:2px solid #c5ecff; border-radius:14px; padding:7px 12px; font-weight:800; white-space:nowrap; }
  .game-wrap { position:relative; overflow:hidden; border:4px solid white; border-radius:20px; box-shadow:0 12px 30px #12547a25; background:#8be4ff; }
  canvas { display:block; width:100%; height:auto; aspect-ratio: 8 / 5; touch-action:manipulation; }
  .hud { position:absolute; inset:12px 12px auto; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; }
  .hud .pill { background:#ffffffdf; border-color:#ffffff; box-shadow:0 3px 8px #13506b22; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:18px; background:#0b2c4555; }
  .panel { width:min(100%,390px); text-align:center; background:#fff; border:4px solid #d7f5ff; border-radius:24px; padding:22px 18px; box-shadow:0 10px 0 #1677ff30; }
  .panel h2 { font-size:clamp(1.7rem,6vw,2.4rem); line-height:1.05; margin:0 0 10px; color:#1261c9; }
  .panel p { margin:8px 0 18px; line-height:1.5; }
  button { font:inherit; font-weight:800; border:0; cursor:pointer; touch-action:manipulation; }
  .main-btn { background:linear-gradient(#ffdc54,#ffb51e); color:#583800; padding:12px 24px; border-radius:14px; box-shadow:0 5px 0 #d98b08; }
  .main-btn:active { transform:translateY(3px); box-shadow:0 2px 0 #d98b08; }
  .controls { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; }
  .control-btn { min-width:112px; padding:12px 16px; border-radius:15px; color:white; background:#1677ff; box-shadow:0 4px 0 #0d4caa; }
  .control-btn:active { transform:translateY(2px); box-shadow:0 2px 0 #0d4caa; }
  .help { text-align:center; font-size:.88rem; margin:12px 4px 0; color:#2d5873; }
  .hidden { display:none !important; }
  @media (max-width:520px) {
    body { padding:8px; }
    header { align-items:flex-start; }
    .subtitle { max-width:200px; }
    .pill { padding:6px 9px; font-size:.9rem; }
    .controls { margin-top:10px; }
    .control-btn { min-width:0; flex:1; }
    .help { font-size:.8rem; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>🐸 nogasonsui_frog</h1>
      <div class="subtitle">Run, jump, collect stars!</div>
    </div>
    <div class="pill">⭐ Best: <span id="best">0</span></div>
  </header>
  <main class="game-wrap">
    <canvas id="game" width="800" height="500" aria-label="Jungle Dash endless runner game"></canvas>
    <div class="hud">
      <div class="pill">⭐ <span id="score">0</span></div>
      <div class="pill">🪙 <span id="coins">0</span></div>
    </div>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2 id="panelTitle">Jungle Dash!</h2>
        <p id="panelText">Help nogasonsui_frog run, jump over logs, and collect shiny stars!</p>
        <button class="main-btn" id="startBtn">▶ Start Running</button>
      </div>
    </div>
  </main>
  <div class="controls">
    <button class="control-btn" id="jumpBtn">⬆ JUMP</button>
    <button class="control-btn" id="restartBtn">↻ RESTART</button>
  </div>
  <p class="help">Computer: press <b>Space</b> or <b>↑</b> to jump. Phone/tablet: tap JUMP or tap the game.</p>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const coinsEl = document.getElementById('coins');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const panelTitle = document.getElementById('panelTitle');
  const panelText = document.getElementById('panelText');
  const startBtn = document.getElementById('startBtn');
  const W = canvas.width, H = canvas.height, groundY = 405;
  let running = false, gameOver = false, lastTime = 0;
  let score = 0, coins = 0, speed = 300, spawnTimer = 0, coinTimer = 0, scenery = 0;
  let obstacles = [], stars = [], clouds = [];
  let best = Number(localStorage.getItem('jungleDashBest') || 0);
  bestEl.textContent = best;
  const player = { x:105, y:groundY-58, w:43, h:58, vy:0, grounded:true, squash:0 };
  const gravity = 1700, jumpPower = 650;

  function reset() {
    score=0; coins=0; speed=300; spawnTimer=.9; coinTimer=.6; scenery=0;
    obstacles=[]; stars=[]; player.y=groundY-player.h; player.vy=0; player.grounded=true; player.squash=0;
    clouds=[{x:130,y:85,s:1},{x:430,y:125,s:.75},{x:680,y:65,s:.9}];
    scoreEl.textContent='0'; coinsEl.textContent='0'; gameOver=false;
  }
  function start() { reset(); running=true; overlay.classList.add('hidden'); lastTime=performance.now(); requestAnimationFrame(loop); }
  function endGame() {
    running=false; gameOver=true;
    best=Math.max(best,Math.floor(score)); localStorage.setItem('jungleDashBest',String(best)); bestEl.textContent=best;
    panelTitle.textContent='Great run! 🎉';
    panelText.innerHTML=`You scored <b>${Math.floor(score)}</b> points and collected <b>${coins}</b> stars. Want another try?`;
    startBtn.textContent='↻ Play Again'; overlay.classList.remove('hidden');
  }
  function jump() {
    if (!running) return;
    if (player.grounded) { player.vy=-jumpPower; player.grounded=false; player.squash=1; }
  }
  startBtn.addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', start);
  document.getElementById('jumpBtn').addEventListener('pointerdown', e=>{e.preventDefault(); jump();});
  canvas.addEventListener('pointerdown', ()=>{ if(running) jump(); });
  window.addEventListener('keydown', e=>{
    if (['Space','ArrowUp','KeyW'].includes(e.code)) { e.preventDefault(); if(!running && !gameOver) start(); else jump(); }
    if (e.code==='Enter' && !running) start();
  });

  function roundedRect(x,y,w,h,r,color) {
    ctx.fillStyle=color; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  }
  function drawCloud(x,y,s) {
    ctx.fillStyle='#ffffffd9'; ctx.beginPath();
    ctx.ellipse(x,y,30*s,17*s,0,0,Math.PI*2);
    ctx.ellipse(x-22*s,y+7*s,20*s,13*s,0,0,Math.PI*2);
    ctx.ellipse(x+20*s,y+8*s,23*s,14*s,0,0,Math.PI*2); ctx.fill();
  }
  function drawTree(x,y,scale,color) {
    ctx.fillStyle='#8b552e'; ctx.fillRect(x-7*scale,y-38*scale,14*scale,42*scale);
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(x,y-45*scale,27*scale,0,Math.PI*2);
    ctx.arc(x-18*scale,y-31*scale,19*scale,0,Math.PI*2);
    ctx.arc(x+18*scale,y-30*scale,19*scale,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#63c94f'; ctx.beginPath(); ctx.arc(x-8*scale,y-52*scale,12*scale,0,Math.PI*2); ctx.fill();
  }
  function drawBackground(dt) {
    const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#72d9ff'); sky.addColorStop(1,'#d6f8ff');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    // distant hills
    ctx.fillStyle='#80d6a0'; ctx.beginPath(); ctx.moveTo(0,300);
    for(let x=0;x<=W;x+=80) ctx.quadraticCurveTo(x+40,240+Math.sin(x*.02)*20,x+80,300);
    ctx.lineTo(W,groundY); ctx.lineTo(0,groundY); ctx.fill();
    if(running) scenery += speed*dt*.18;
    clouds.forEach(c=>{ drawCloud(((c.x-scenery*.5+1000)%1000)-100,c.y,c.s); });
    for(let i=0;i<7;i++) {
      const x=((i*155-scenery*.7)%1100+1100)%1100-120;
      drawTree(x,groundY-8,0.8+(i%3)*.13,['#2aab69','#22975e','#45bd69'][i%3]);
    }
    // ground
    ctx.fillStyle='#a96735'; ctx.fillRect(0,groundY,W,H-groundY);
    ctx.fillStyle='#48bd50'; ctx.fillRect(0,groundY,W,17);
    ctx.fillStyle='#83e85e';
    for(let x=-20-(scenery%48);x<W+40;x+=48) {
      ctx.beginPath(); ctx.moveTo(x,groundY); ctx.lineTo(x+14,groundY+14); ctx.lineTo(x+27,groundY); ctx.fill();
    }
    ctx.fillStyle='#87502e';
    for(let x=-20-(scenery%80);x<W+80;x+=80) {
      ctx.fillRect(x,groundY+48,42,7); ctx.fillRect(x+48,groundY+100,24,6);
    }
  }
  function drawFallbackPlayer() {
    const bob = running && player.grounded ? Math.sin(performance.now()*.018)*2 : 0;
    const x=player.x, y=player.y+bob;
    // backpack
    roundedRect(x-7,y+19,16,25,6,'#e65d36');
    // legs
    ctx.strokeStyle='#194d9c'; ctx.lineWidth=8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x+19,y+43); ctx.lineTo(x+14+(player.grounded?Math.sin(performance.now()*.02)*7:0),y+55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+30,y+43); ctx.lineTo(x+37-(player.grounded?Math.sin(performance.now()*.02)*7:0),y+54); ctx.stroke();
    roundedRect(x+4,y+50,18,8,4,'#f7f7ff'); roundedRect(x+29,y+50,18,8,4,'#f7f7ff');
    // body
    roundedRect(x+2,y+19,35,30,10,'#1688ef');
    // face
    ctx.fillStyle='#ffc58c'; ctx.beginPath(); ctx.ellipse(x+24,y+15,19,21,0,0,Math.PI*2); ctx.fill();
    // hair
    ctx.fillStyle='#6d3d22'; ctx.beginPath(); ctx.arc(x+17,y+4,13,Math.PI,Math.PI*2); ctx.arc(x+28,y+4,12,Math.PI,Math.PI*2); ctx.arc(x+35,y+10,7,Math.PI*1.2,Math.PI*1.9); ctx.fill();
    // eye and smile
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(x+30,y+14,5,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#193653'; ctx.beginPath(); ctx.arc(x+32,y+15,2.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#a84632'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x+29,y+22,6,.2,1.5); ctx.stroke();
    // arm
    ctx.strokeStyle='#ffc58c'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(x+9,y+26); ctx.lineTo(x-1,y+35); ctx.stroke();
  }

  // Custom lime-green frog runner sprite
  const frogSprite = new Image();

  function drawPlayer() {
    if (!frogSprite.complete || !frogSprite.naturalWidth) {
      drawFallbackPlayer();
      return;
    }
    const bob = running && player.grounded ? Math.sin(performance.now()*.018)*2 : 0;
    // Keep the character inside its original collision box while displaying the frog art.
    ctx.drawImage(frogSprite, player.x-34, player.y-28+bob, 112, 104);
  }

  function drawLog(o) {
    roundedRect(o.x,o.y,o.w,o.h,7,'#98552b');
    roundedRect(o.x+3,o.y+3,o.w-6,7,4,'#c98242');
    ctx.strokeStyle='#6d3b22'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(o.x+12,o.y+12); ctx.lineTo(o.x+o.w-10,o.y+12);
    ctx.moveTo(o.x+o.w*.35,o.y+4); ctx.lineTo(o.x+o.w*.35,o.y+o.h-4); ctx.stroke();
    ctx.fillStyle='#58b74b'; ctx.fillRect(o.x+4,o.y-3,o.w-8,4);
  }
  function drawStar(s) {
    const cx=s.x, cy=s.y;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.sin(performance.now()*.004+s.x)*.15);
    ctx.fillStyle='#ffce28'; ctx.strokeStyle='#f59b0b'; ctx.lineWidth=3;
    ctx.beginPath();
    for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2===0?13:6.5; const px=Math.cos(a)*r,py=Math.sin(a)*r; if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  }
  function update(dt) {
    score += dt*10; speed=Math.min(520,300+score*1.15);
    scoreEl.textContent=Math.floor(score); coinsEl.textContent=coins;
    player.vy += gravity*dt; player.y += player.vy*dt;
    if(player.y>=groundY-player.h){player.y=groundY-player.h;player.vy=0;player.grounded=true;}
    player.squash=Math.max(0,player.squash-dt*3);
    spawnTimer-=dt;
    if(spawnTimer<=0){ const h=28+Math.random()*17,w=30+Math.random()*18; obstacles.push({x:W+20,y:groundY-h,w,h}); spawnTimer=Math.max(.72,1.35-Math.random()*.3-score/800)+Math.random()*.35; }
    coinTimer-=dt;
    if(coinTimer<=0){const count=3+Math.floor(Math.random()*3);for(let i=0;i<count;i++)stars.push({x:W+30+i*34,y:groundY-100-Math.sin(i/(count-1||1)*Math.PI)*28,r:13,taken:false});coinTimer=2.1+Math.random()*1.2;}
    obstacles.forEach(o=>o.x-=speed*dt); obstacles=obstacles.filter(o=>o.x+o.w>-20);
    stars.forEach(s=>s.x-=speed*dt); stars=stars.filter(s=>s.x>-30&&!s.taken);
    for(const o of obstacles) {
      const px=player.x+7, py=player.y+5, pw=player.w-12, ph=player.h-8;
      if(px<o.x+o.w-4&&px+pw>o.x+4&&py<o.y+o.h&&py+ph>o.y+5){endGame();return;}
    }
    for(const s of stars) {
      const px=player.x+player.w/2,py=player.y+player.h/2;
      if(!s.taken&&Math.hypot(px-s.x,py-s.y)<31){s.taken=true;coins++;score+=15;coinsEl.textContent=coins;}
    }
  }
  function draw() {
    drawBackground(0);
    stars.forEach(drawStar); obstacles.forEach(drawLog); drawPlayer();
    // little birds
    const bx=(W-(performance.now()*.06)%950);
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bx,170,8,Math.PI,Math.PI*1.9);ctx.arc(bx+13,170,8,Math.PI*1.1,Math.PI*2);ctx.stroke();
  }
  function loop(now) {
    if(!running)return;
    const dt=Math.min((now-lastTime)/1000,.035);lastTime=now;
    update(dt);draw();
    if(running)requestAnimationFrame(loop);
  }
  reset(); draw();
})();
